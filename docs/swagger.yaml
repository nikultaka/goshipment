host: localhost:8081
info:
  contact:
    email: support@gogin.com
    name: API Support
  description: |-
    A comprehensive REST API built with Go and Gin framework
    This API provides user authentication, profile management, and admin operations.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Gogin API
  version: "1.0"
paths:
  /.well-known/openid-configuration:
    get:
      description: Returns the OpenID Connect discovery document (RFC 8414)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_oauth2.OIDCDiscoveryResponse'
      summary: OIDC Discovery Document
      tags:
      - OAuth2.1 / OIDC
  /admin/audit-logs:
    get:
      consumes:
      - application/json
      description: Retrieve audit logs with optional filtering and pagination (Admin
        only)
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by actor type (user, admin, api_client, system)
        in: query
        name: actor_type
        type: string
      - description: Filter by action (partial match)
        in: query
        name: action
        type: string
      - description: Filter by resource type
        in: query
        name: resource_type
        type: string
      - description: Filter by status (success, failure, denied)
        in: query
        name: status
        type: string
      - description: Filter by start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter by end date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: limit
        type: integer
      - default: occurred_at
        description: Sort field (occurred_at, recorded_at)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/gogin_internal_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_audit.AuditLogsListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gogin_internal_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gogin_internal_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/gogin_internal_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gogin_internal_response.Response'
      security:
      - BearerAuth: []
      summary: Get audit logs
      tags:
      - Admin - Audit Logs
  /admin/audit-logs/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific audit log entry
