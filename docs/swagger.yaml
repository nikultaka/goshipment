            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Logout from other devices
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  properties:
                    user:
                      $ref: '#/definitions/users.UserResponse'
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                errors:
                  items:
                    $ref: '#/definitions/response.ResponseError'
                  type: array
              type: object
      summary: Register a new user
      tags:
      - Users
  /verify-email:
    get:
      description: Verify an email address using the verification token sent to the
        email
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Verify email address
      tags:
      - Users
  /wallet:
    get:
      description: Retrieve current organization's wallet balance, held balance, and
        recent transactions
      parameters:
      - default: 1
        description: Page number for transactions
        in: query
        name: page
        type: integer
      - default: 20
        description: Number of transactions per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Wallet retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wallet.WalletResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden - user not in organization
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Wallet not found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get organization wallet status
      tags:
      - Wallet
  /wallet/lock:
    post:
      description: Lock wallet to prevent all debit operations (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: Wallet locked successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wallet.WalletStatusResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden - requires Admin role
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Wallet not found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Lock organization wallet
      tags:
      - Wallet
  /wallet/refund:
    post:
      consumes:
      - application/json
      description: Process a shipment refund to organization wallet (Manager/Admin
        only)
      parameters:
      - description: Refund request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.RefundRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Refund successful
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wallet.RefundResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden - requires Manager or Admin role
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Shipment not found
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict - shipment already refunded
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Refund shipment amount to wallet
      tags:
      - Wallet
  /wallet/topup:
    post:
      consumes:
      - application/json
      description: Add funds to organization wallet using Stripe payment method
      parameters:
      - description: Top-up request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.TopUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Top-up successful
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wallet.TopUpResponse'
              type: object
        "400":
          description: Invalid request or amount constraints violated
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "402":
          description: Payment required - Stripe payment failed
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden - user not in organization
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict - wallet is locked or disabled
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Top up wallet via Stripe
      tags:
      - Wallet
  /wallet/unlock:
    post:
      description: Unlock wallet to restore normal operations (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: Wallet unlocked successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wallet.WalletStatusResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden - requires Admin role
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Wallet not found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Unlock organization wallet
      tags:
      - Wallet
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: System health and status endpoints
  name: Core
- description: User authentication and profile management
  name: Users
- description: Administrative user management endpoints (requires admin role)
  name: Admin
- description: OAuth 2.1 authorization server endpoints
  name: OAuth2.1
- description: OAuth client management (admin only)
  name: API Clients
- description: User notifications and messaging
  name: Notifications
- description: Review and rating system
  name: Reviews
- description: System and user settings management
  name: Settings
- description: Support ticket management
  name: Tickets
- description: File storage and management (upload/download public and private files)
  name: Storage
- description: Google and Facebook OAuth2 login integration
  name: Social Auth
- description: Admin audit log query and export (requires admin role)
  name: Admin - Audit Logs
- description: Admin dashboard financial metrics and analytics (requires admin role)
  name: Admin - Dashboard
- description: Admin notification template management (requires admin role)
  name: Admin - Notification Templates
- description: Shipment rate quotes and cost estimation (guest-friendly, no auth required)
  name: Shipment Estimates
- description: Purchase and manage shipping labels (MONETIZATION POINT - requires
    authentication)
  name: Labels
- description: Organization wallet management - balance, top-ups, refunds, and transactions
    (PAYMENT ENGINE)
  name: Wallet
- description: Legal and financial records - immutable invoices, credit notes, and
    PDF downloads (ACCOUNTING & COMPLIANCE)
  name: Invoices
- description: Schedule and manage carrier pickups for shipments (LOGISTICS & FULFILLMENT)
  name: Pickups
- description: Customer support ticket system - create tickets, reply to conversations,
    manage resolutions (CUSTOMER SERVICE)
  name: Support
- description: Commission earnings tracking for Sales Representatives - view commissions,
    request payouts, process payments (FINANCIAL RECORDS)
  name: Commissions
- description: Referral redemption records - immutable ledger tracking referred users
    and commission eligibility (READ-ONLY FINANCIAL RECORDS)
  name: Referrals
