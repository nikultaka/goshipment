            $ref: '#/definitions/gogin_internal_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/gogin_internal_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gogin_internal_response.Response'
