  /pickups:
    get:
      description: Retrieve a paginated list of pickups for the authenticated user's
        organization. Users see only their own shipments' pickups, while managers
        and admins see all organization pickups. Supports filtering by status, shipment
        ID, and date range.
      parameters:
      - description: Filter by pickup status
        enum:
        - draft
        - scheduled
        - rescheduled
        - cancelled
        - completed
        - failed
        in: query
        name: status
        type: string
      - description: Filter by shipment ID (UUID)
        format: uuid
        in: query
        name: shipment_id
        type: string
      - description: Filter pickups from this date (YYYY-MM-DD)
        format: date
        in: query
        name: from_date
        type: string
      - description: Filter pickups until this date (YYYY-MM-DD)
        format: date
        in: query
        name: to_date
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Number of items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Pickups retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/pickups.ListPickupsResponse'
              type: object
        "400":
          description: Invalid request - invalid query parameters
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden - user not in organization
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List pickups for organization
      tags:
      - Pickups
    post:
      consumes:
      - application/json
      description: Schedule a carrier pickup for a shipment. Shipment must be in 'label_purchased'
        or 'ready_for_pickup' status. Same-day pickups require system and organization
        settings to allow them. The pickup address is taken from the shipment's from_address
        and stored as an immutable snapshot.
      parameters:
      - description: Pickup schedule request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pickups.SchedulePickupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Pickup scheduled successfully
