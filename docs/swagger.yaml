  /commissions:
    get:
      description: Retrieve a list of commission transactions. Sales Reps see only
        their own commissions, Admins see all commissions for the organization. Includes
        balance summaries (total earnings, eligible balance, paid balance).
      parameters:
      - description: Filter by status
        enum:
        - pending
        - eligible
        - processing
        - paid
        - voided
        in: query
        name: status
        type: string
      - description: Filter by shipment ID (UUID)
        format: uuid
        in: query
        name: shipment_id
        type: string
      - description: Filter from this date (YYYY-MM-DD)
        format: date
        in: query
        name: from_date
        type: string
      - description: Filter until this date (YYYY-MM-DD)
        format: date
        in: query
        name: to_date
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Number of items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Commissions retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/commissions.ListCommissionsResponse'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden - user not in organization
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List commission transactions
      tags:
      - Commissions
  /commissions/payout:
    post:
      consumes:
      - application/json
      description: 'Sales Rep: Request a payout for eligible commission transactions.
        The request will be pending admin review. Admin: Process (approve/reject)
        a payout request. Approval creates a payout record and marks transactions
        as paid.'
      parameters:
      - description: Payout request details (for Sales Rep) - Provide commission_transaction_ids
          and payout_method
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commissions.RequestPayoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Payout request submitted successfully (Sales Rep)
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/commissions.RequestPayoutResponse'
              type: object
        "400":
          description: Invalid request - no eligible commissions, validation errors,
            or currency mismatch
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden - user not in organization or not owner of commissions
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict - commission already paid or not eligible
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Request commission payout (Sales Rep) OR Process payout (Admin)
      tags:
      - Commissions
  /commissions/payout/process:
    post:
      consumes:
      - application/json
      description: Admin-only endpoint to approve or reject a pending payout request.
        Approval creates a payout record and marks commission transactions as paid.
        Rejection updates the request status with a review note.
      parameters:
      - description: Payout processing details - action must be 'approve' or 'reject'
        in: body
